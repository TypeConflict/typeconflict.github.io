name = "corner-publish-studio"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

[[d1_databases]]
binding = "DB"
database_name = "corner-studio-sessions"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
ALLOWED_LOGIN = "TypeConflict"
GH_CLIENT_ID = "REPLACE_WITH_GITHUB_APP_CLIENT_ID"
