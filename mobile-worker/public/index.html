<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f5"><meta name="description" content="Corner private publishing studio"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><title>Corner · Studio</title></head><body><header><a class="brand" href="/">Corner<span>.</span></a><div id="user">私人發文工具</div></header><main><section id="login"><h1>寫些什麼？</h1><p>短筆記、長文，還有今天遇見的鳥。</p><a class="primary" href="/auth/start">使用 GitHub 登入</a><p class="hint">僅限網站擁有者。登入後不用反覆貼 Token。</p><p id="loginStatus" role="status"></p></section><section id="editor" hidden><div class="tabs"><button type="button" data-type="notes" class="active">Note</button><button type="button" data-type="blog">Blog</button><button type="button" data-type="photos">Photo</button></div><form id="form"><div id="blogExtra" hidden><label for="title">標題</label><input id="title" maxlength="160" placeholder="今天學到了什麼"><label for="summary">摘要</label><input id="summary" maxlength="400" placeholder="用一句話介紹這篇文章"></div><div id="photoExtra" hidden><label for="photo">選擇照片（每篇一張）</label><input type="file" id="photo" accept="image/*"><img id="preview" alt="照片預覽" hidden><p class="hint">發布時將壓縮為 WebP，長邊最多 1800px。</p></div><label id="bodyLabel" for="body">Note</label><textarea id="body" rows="8" required placeholder="一個小發現……"></textarea><label for="tags">Tags（逗號分隔）</label><input id="tags" placeholder="Birds, AI"><div class="actions"><button type="submit" class="primary" id="submit">發布 Note</button><button type="button" id="clearForm" class="soft">清空</button></div><p id="status" role="status" aria-live="polite"></p></form><div class="divider"></div><div class="history"><div class="history-head"><h2>已發表</h2><button type="button" class="soft" id="refresh">更新</button></div><div id="posts"></div></div><button type="button" class="signout" id="logout">登出</button></section></main><script type="module" src="/client.js?v=3"></script></body></html>
